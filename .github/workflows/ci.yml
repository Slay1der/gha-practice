name: CI

on:
  push:                  # trigger 1: someone pushes to main
    branches: [main]
  pull_request:          # trigger 2: someone opens or updates a pull request
  workflow_dispatch:     # trigger 3: someone clicks the "Run workflow" button
jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: "bash -n app.sh"
    run-app:
      needs: validate
      runs-on: ubuntu-latest
      steps:
          - uses: actions/checkout@v4
          - run: |
              echo "Triggered by ${{ github.actor }}"
              echo "Branch: ${{ github.ref }}"  
          - run: "bash app.sh"
